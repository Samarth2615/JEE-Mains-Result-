<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>JEE Marks Calculator</title>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <h1>JEE Mains Marks Calculator</h1>
    <p>Upload your response sheet (HTML or PDF) and select the appropriate shift to calculate your score.</p>
    
    <section>
      <form id="upload-form">
        <label for="shift">Select Shift:</label>
        <select id="shift" name="shift" required>
          <option value="shift1">Shift 1</option>
          <option value="shift2">Shift 2</option>
          <!-- Add more shifts as needed -->
        </select>

        <label for="responseFile">Upload Response Sheet:</label>
        <input type="file" id="responseFile" accept=".html,.pdf" required>
        
        <button type="submit">Calculate Score</button>
      </form>
    </section>

    <section id="results" hidden>
      <h2>Results</h2>
      <p>Shift: <span id="result-shift"></span></p>
      <p>Total Score: <span id="result-score"></span></p>
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Attempted</th>
            <th>Correct</th>
            <th>Incorrect</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="result-details"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
